<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" width="560" height="540" role="img" aria-labelledby="t d">
  <title id="t">Drapery measurements when no rod or track is installed</title>
  <desc id="d">A window between the ceiling and floor. A is the window width including the outer trim. B is the window height including the outer trim. C is the distance from the ceiling to the floor. D is the distance from the bottom of the trim to the floor.</desc>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7d5a3a"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #2a2622; }
      .lbl { font-size: 22px; }
      .lbl-b { font-size: 22px; font-weight: 700; }
      .dim { stroke: #7d5a3a; stroke-width: 3.5; marker-start: url(#arw); marker-end: url(#arw); fill: none; }
      .ext { stroke: #7d5a3a; stroke-width: 2; stroke-dasharray: 6 5; fill: none; }
      .badge-t { font-size: 22px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>
  <rect width="560" height="540" rx="16" fill="#faf7f2"/>
  <rect x="20" y="50" width="520" height="440" fill="#f1e9dd"/>
  <line x1="20" y1="50" x2="540" y2="50" stroke="#2a2622" stroke-width="5"/>
  <line x1="20" y1="490" x2="540" y2="490" stroke="#2a2622" stroke-width="5"/>
  <text class="lbl" x="40" y="36" text-anchor="start">Ceiling</text>
  <text class="lbl" x="40" y="522" text-anchor="start">Floor</text>
  <rect x="170" y="150" width="220" height="220" fill="#ffffff" stroke="#2a2622" stroke-width="3"/>
  <rect x="194" y="174" width="172" height="172" fill="#d8c8b0" stroke="#2a2622" stroke-width="2"/>
  <rect x="210" y="190" width="140" height="140" fill="#dfe8e6" stroke="#2a2622" stroke-width="2"/>
  <path d="M194 174 L210 190 M366 174 L350 190 M194 346 L210 330 M366 346 L350 330" stroke="#2a2622" stroke-width="1.5"/>
  <line x1="210" y1="260" x2="350" y2="260" stroke="#2a2622" stroke-width="4"/>
  <line class="ext" x1="170" y1="150" x2="170" y2="98"/>
  <line class="ext" x1="390" y1="150" x2="390" y2="98"/>
  <line class="dim" x1="170" y1="110" x2="390" y2="110"/>
  <circle cx="280" cy="110" r="18" fill="#7d5a3a" stroke="#faf7f2" stroke-width="3"/>
  <text class="badge-t" x="280" y="118" text-anchor="middle">A</text>
  <line class="ext" x1="390" y1="150" x2="434" y2="150"/>
  <line class="ext" x1="390" y1="370" x2="484" y2="370"/>
  <line class="dim" x1="424" y1="150" x2="424" y2="370"/>
  <circle cx="424" cy="260" r="18" fill="#7d5a3a" stroke="#faf7f2" stroke-width="3"/>
  <text class="badge-t" x="424" y="268" text-anchor="middle">B</text>
  <line class="dim" x1="80" y1="53" x2="80" y2="487"/>
  <circle cx="80" cy="270" r="18" fill="#7d5a3a" stroke="#faf7f2" stroke-width="3"/>
  <text class="badge-t" x="80" y="278" text-anchor="middle">C</text>
  <line class="dim" x1="474" y1="370" x2="474" y2="487"/>
  <circle cx="474" cy="430" r="18" fill="#7d5a3a" stroke="#faf7f2" stroke-width="3"/>
  <text class="badge-t" x="474" y="438" text-anchor="middle">D</text>
</svg>
