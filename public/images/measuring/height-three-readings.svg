<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" role="img" aria-labelledby="t d">
  <title id="t">Measure the height in three places</title>
  <desc id="d">Front view of a window opening with three height measurements from the top of the opening to the sill: 1 on the left side, 2 in the center, and 3 on the right side.</desc>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7d5a3a"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #2a2622; }
      .lbl { font-size: 22px; }
      .lbl-b { font-size: 22px; font-weight: 700; }
      .dim { stroke: #7d5a3a; stroke-width: 3.5; marker-start: url(#arw); marker-end: url(#arw); fill: none; }
      .ext { stroke: #7d5a3a; stroke-width: 2; stroke-dasharray: 6 5; fill: none; }
      .badge-t { font-size: 22px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>
  <rect width="560" height="440" rx="16" fill="#faf7f2"/>
  <rect x="20" y="20" width="520" height="340" rx="8" fill="#f1e9dd"/>
  <rect x="150" y="40" width="260" height="280" fill="#ffffff" stroke="#2a2622" stroke-width="3"/>
  <rect x="174" y="64" width="212" height="232" fill="#d8c8b0" stroke="#2a2622" stroke-width="2"/>
  <rect x="190" y="80" width="180" height="200" fill="#dfe8e6" stroke="#2a2622" stroke-width="2"/>
  <path d="M174 64 L190 80 M386 64 L370 80 M174 296 L190 280 M386 296 L370 280" stroke="#2a2622" stroke-width="1.5"/>
  <line x1="190" y1="180" x2="370" y2="180" stroke="#2a2622" stroke-width="4"/>
  <line class="dim" x1="190" y1="64" x2="190" y2="296"/>
  <circle cx="190" cy="236" r="18" fill="#7d5a3a" stroke="#faf7f2" stroke-width="3"/>
  <text class="badge-t" x="190" y="244" text-anchor="middle">1</text>
  <text class="lbl" x="190" y="348" text-anchor="middle">Left</text>
  <line class="dim" x1="280" y1="64" x2="280" y2="296"/>
  <circle cx="280" cy="236" r="18" fill="#7d5a3a" stroke="#faf7f2" stroke-width="3"/>
  <text class="badge-t" x="280" y="244" text-anchor="middle">2</text>
  <text class="lbl" x="280" y="348" text-anchor="middle">Center</text>
  <line class="dim" x1="370" y1="64" x2="370" y2="296"/>
  <circle cx="370" cy="236" r="18" fill="#7d5a3a" stroke="#faf7f2" stroke-width="3"/>
  <text class="badge-t" x="370" y="244" text-anchor="middle">3</text>
  <text class="lbl" x="370" y="348" text-anchor="middle">Right</text>
  <text class="lbl" x="280" y="412" text-anchor="middle">Write down all three heights</text>
</svg>
