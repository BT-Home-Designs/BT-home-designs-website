<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" role="img" aria-labelledby="t d">
  <title id="t">Valance: desired width and height</title>
  <desc id="d">A valance across the top of a window. A is the finished width you would like and B is the finished height you would like, measured from the top of the valance to its bottom edge.</desc>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7d5a3a"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #2a2622; }
      .lbl { font-size: 22px; }
      .lbl-b { font-size: 22px; font-weight: 700; }
      .dim { stroke: #7d5a3a; stroke-width: 3.5; marker-start: url(#arw); marker-end: url(#arw); fill: none; }
      .ext { stroke: #7d5a3a; stroke-width: 2; stroke-dasharray: 6 5; fill: none; }
      .badge-t { font-size: 22px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>
  <rect width="560" height="440" rx="16" fill="#faf7f2"/>
  <rect x="20" y="20" width="520" height="400" rx="8" fill="#f1e9dd"/>
  <rect x="150" y="110" width="240" height="262" fill="#ffffff" stroke="#2a2622" stroke-width="3"/>
  <rect x="174" y="134" width="192" height="214" fill="#d8c8b0" stroke="#2a2622" stroke-width="2"/>
  <rect x="190" y="150" width="160" height="182" fill="#dfe8e6" stroke="#2a2622" stroke-width="2"/>
  <path d="M174 134 L190 150 M366 134 L350 150 M174 348 L190 332 M366 348 L350 332" stroke="#2a2622" stroke-width="1.5"/>
  <line x1="190" y1="241" x2="350" y2="241" stroke="#2a2622" stroke-width="4"/>
  <path d="M150 110 H390 V200 Q330 178 270 200 Q210 178 150 200 Z" fill="#c4a179" stroke="#2a2622" stroke-width="2.5"/>
  <line class="ext" x1="150" y1="110" x2="150" y2="58"/>
  <line class="ext" x1="390" y1="110" x2="390" y2="58"/>
  <line class="dim" x1="150" y1="70" x2="390" y2="70"/>
  <circle cx="270" cy="70" r="18" fill="#7d5a3a" stroke="#faf7f2" stroke-width="3"/>
  <text class="badge-t" x="270" y="78" text-anchor="middle">A</text>
  <line class="ext" x1="390" y1="110" x2="454" y2="110"/>
  <line class="ext" x1="390" y1="200" x2="454" y2="200"/>
  <line class="dim" x1="442" y1="110" x2="442" y2="200"/>
  <circle cx="442" cy="155" r="18" fill="#7d5a3a" stroke="#faf7f2" stroke-width="3"/>
  <text class="badge-t" x="442" y="163" text-anchor="middle">B</text>
  <text class="lbl" x="280" y="414" text-anchor="middle">Width and height you'd like</text>
</svg>
