<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" width="560" height="520" role="img" aria-labelledby="t d">
  <title id="t">Drapery measurements with a rod or track already installed</title>
  <desc id="d">A drapery rod mounted above a window, with a decorative finial on each end. A is the rod width from end to end, not including the finials. B is the distance from the top of the rod to the floor.</desc>
