<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470" role="img" aria-labelledby="t d">
  <title id="t">Outside mount: measure the full window, trim, and sill</title>
  <desc id="d">Front view of a window with trim, a sill ledge, and a trim piece below the sill. Width A runs from the outside edge of the trim on the left to the outside edge on the right. Height B runs from the top edge of the top trim down to the bottom of the lowest piece below the window. C is the width of the sill from end to end, where it sticks out past the trim.</desc>
