  <rect x="112" y="334" width="296" height="16" fill="#ffffff" stroke="#2a2622" stroke-width="3"/>
  <rect x="144" y="350" width="232" height="24" fill="#ffffff" stroke="#2a2622" stroke-width="3"/>
  <line class="ext" x1="130" y1="84" x2="130" y2="44"/>
  <line class="ext" x1="390" y1="84" x2="390" y2="44"/>
